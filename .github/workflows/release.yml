# Builds the extension ZIP and publishes a GitHub release when a version tag is pushed.
# Usage: bump "version" in manifest.json, commit, then `git tag v1.2.3 && git push origin v1.2.3`.
# It can also be run by hand from the Actions tab; it then releases the manifest version from main.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out release tag
        run: |
          tag="v$(jq -r .version manifest.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $tag"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      # The asset name stays the same every release so the
      # .../releases/latest/download/canvas-submitted-work.zip link always works.
      - name: Build ZIP
        run: |
          mkdir dist
          zip -j dist/canvas-submitted-work.zip manifest.json popup.html popup.css popup.js LICENSE

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/canvas-submitted-work.zip \
            --title "$TAG" --target "$GITHUB_SHA" --generate-notes
