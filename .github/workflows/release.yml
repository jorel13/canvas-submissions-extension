# Builds the extension ZIP and publishes a GitHub release when a version tag is pushed.
# Usage: bump "version" in manifest.json, commit, then `git tag v1.2.3 && git push origin v1.2.3`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      # The asset name stays the same every release so the
      # .../releases/latest/download/canvas-submitted-work.zip link always works.
      - name: Build ZIP
        run: |
          mkdir dist
          zip -j dist/canvas-submitted-work.zip manifest.json popup.html popup.css popup.js LICENSE

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/canvas-submitted-work.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
